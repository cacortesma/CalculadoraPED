    <title>Calculadora PED (2014/68/UE) - OCA Global</title>

    <style>
        /* Clases corporativas OCA Global fijas para garantizar el diseño bajo cualquier circunstancia */

        .text-oca-blue { color: #002A54 !important; }

        .bg-oca-red { background-color: #E14D3D !important; }
        .text-oca-red { color: #E14D3D !important; }
        .border-oca-red { border-color: #E14D3D !important; }

        .bg-oca-light { background-color: #F8FAFC !important; }

        /* Estilos específicos para impresión / exportación a PDF */

                size: A4;

            body {
                background-color: #ffffff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                margin: 0;
                padding: 0;

            .no-print {

<body class="bg-slate-50 text-gray-800 min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function PEDCalculator() {
            // Estado del formulario
            const [tag, setTag] = useState('V-101 Recipiente de Nitrógeno / Aire');
            const [temp, setTemp] = useState('-10 ºC a 120 ºC');
            const [equipmentType, setEquipmentType] = useState('vessel'); 
            const [fluidState, setFluidState] = useState('gas'); 
            const [fluidGroup, setFluidGroup] = useState('2'); 
            const [pressure, setPressure] = useState('10');
            const [size, setSize] = useState('250');
            const [result, setResult] = useState(null);

            // Módulos de conformidad
            const modulesData = {
                'SEP': [],
                'I': [{ title: 'Módulo A', desc: 'Control interno de la producción.' }],
                'II': [
                    { title: 'Módulo A2', desc: 'Control interno de producción + Ensayos supervisados.' },
                    { title: 'Módulo D1', desc: 'Garantía de calidad del proceso de producción.' },
                    { title: 'Módulo E1', desc: 'Garantía de calidad de la inspección y ensayos finales.' }
                ],
                'III': [
                    { title: 'Módulo B (Diseño) + D', desc: 'Examen UE de tipo + Garantía de calidad de producción.' },
                    { title: 'Módulo B (Diseño) + F', desc: 'Examen UE de tipo + Verificación de conformidad de producto.' },
                    { title: 'Módulo B (Producción) + E', desc: 'Examen UE de tipo + Garantía calidad del producto final.' },
                    { title: 'Módulo B (Producción) + C2', desc: 'Examen UE de tipo + Ensayos aleatorios de producto.' },
                    { title: 'Módulo H', desc: 'Garantía de calidad total (Diseño, fabricación y ensayos).' }
                ],
                'IV': [
                    { title: 'Módulo B (Producción) + D', desc: 'Examen UE de tipo + Garantía de calidad de producción.' },
                    { title: 'Módulo B (Producción) + F', desc: 'Examen UE de tipo + Verificación de producto.' },
                    { title: 'Módulo G', desc: 'Verificación CE por unidad.' },
                    { title: 'Módulo H1', desc: 'Garantía de calidad total con examen de diseño.' }
                ]
            };

            // Configuración de Inspecciones Periódicas (RD 809/2021)
            const inspectionsConfig = {
                reglamento: "RD 809/2021",
                inspecciones: {
                    recipientes: [
                        {
                            categorias: ["I-2", "II-2"],
                            nivelA: { "años": 4, agente: "Instaladora/Mantenedora" },
                            nivelB: { "años": 12, agente: "OCA" },
                            nivelC: null
                        },
                        {
                            categorias: ["I-1", "II-1", "III-2", "IV-2"],
                            nivelA: { "años": 3, agente: "Instaladora/Mantenedora" },
                            nivelB: { "años": 6, agente: "OCA" },
                            nivelC: { "años": 12, agente: "OCA" }
                        },
                        {
                            categorias: ["III-1", "IV-1"],
                            nivelA: { "años": 3, agente: "Instaladora/Mantenedora" },
                            nivelB: { "años": 6, agente: "OCA" },
                            nivelC: { "años": 12, agente: "OCA" }
                        }
                    ],
                    tuberias: [
                        {
                            categorias: ["I-2", "II-2"],
                            nivelA: null,
                            nivelB: { "años": 12, agente: "OCA" },
                            nivelC: null
                        },
                        {
                            categorias: ["I-1", "II-1", "III-2"],
                            nivelA: null,
                            nivelB: { "años": 6, agente: "OCA" },
                            nivelC: null
                        },
                        {
                            categorias: ["III-1", "IV-1"],
                            nivelA: null,
                            nivelB: { "años": 6, agente: "OCA" },
                            nivelC: { "años": 12, agente: "OCA" }
                        }
                    ],
                    llama_calor: [
                        {
                            categorias: ["I", "II", "III", "IV"],
                            nivelA: { "años": 1, agente: "Instaladora/Mantenedora" },
                            nivelB: { "años": 3, agente: "OCA" },
                            nivelC: { "años": 6, agente: "OCA" }
                        }
                    ]
                }
            };

            const getPeriodicInspections = (eqType, modKey, group) => {
                if (!modKey || modKey === 'SEP') {
                    return {
                        aplica: false,
                        reglamento: inspectionsConfig.reglamento,
                        motivo: 'Los equipos clasificados en el Artículo 4.3 (SEP) o no afectos a marcado CE no están sujetos a las inspecciones periódicas de Nivel A, B y C por OCA según el RD 809/2021.',
                        nivelA: null,
                        nivelB: null,
                        nivelC: null
                    };
                }

                let typeKey = 'recipientes';
                let catCode = `${modKey}-${group}`;
                let tipoLabel = 'Recipiente a presión';

                if (eqType === 'piping') {
                    typeKey = 'tuberias';
                    catCode = `${modKey}-${group}`;
                    tipoLabel = 'Tubería a presión';
                } else if (eqType === 'steam') {
                    typeKey = 'llama_calor';
                    catCode = modKey;
                    tipoLabel = 'Equipo sometido a llama o calor';
                }

                const list = inspectionsConfig.inspecciones[typeKey] || [];
                const match = list.find(item => item.categorias.includes(catCode));

                if (match) {
                    return {
                        aplica: true,
                        reglamento: inspectionsConfig.reglamento,
                        catCode: catCode,
                        tipoLabel: tipoLabel,
                        nivelA: match.nivelA,
                        nivelB: match.nivelB,
                        nivelC: match.nivelC
                    };
                }

                return {
                    aplica: false,
                    reglamento: inspectionsConfig.reglamento,
                    motivo: 'No se encontraron periodicidades reglamentarias para esta combinación.',
                    nivelA: null,
                    nivelB: null,
                    nivelC: null
                };
            };

            const calculatePEDCategory = () => {
                const ps = parseFloat(pressure);
                const sz = parseFloat(size);

                if (isNaN(ps) || isNaN(sz) || ps <= 0 || sz <= 0) {
                    setResult(null);
                    return;
                }

                if (ps <= 0.5) {
                    setResult({ 
                        cat: 'Fuera del alcance', table: 'Ninguna (PS ≤ 0.5 bar)', 
                        ceON: 'No aplica directiva', onReq: 'NO Requerido', art: '-', modules: 'SEP',
                        fundamento: `El equipo tiene una PS ≤ 0.5 bar, por lo que queda fuera del alcance de la directiva PED.`,
                        inspections: {
                            aplica: false,
                            reglamento: inspectionsConfig.reglamento,
                            motivo: 'El equipo tiene una PS ≤ 0.5 bar, por lo que queda fuera del alcance de las inspecciones periódicas del RD 809/2021.'
                        }
                    });
                    return;
                }

                let category = 'Artículo 4.3 (SEP)';
                let modulesKey = 'SEP';
                const pXv = ps * sz;
                let table = '';
                let fundamento = '';

                // Lógica de las tablas PED
                if (equipmentType === 'vessel') {
                    if (fluidState === 'gas') {
                        if (fluidGroup === '1') {
                            table = 'Cuadro 1 (Recipientes, Gas, Grupo 1)';
                            if (sz <= 1) {
                                category = ps <= 200 ? 'Artículo 4.3 (SEP)' : 'Categoría III';
                                modulesKey = ps <= 200 ? 'SEP' : 'III';
                            } else {
                                if (pXv <= 25) { category = 'Artículo 4.3 (SEP)'; modulesKey = 'SEP'; }
                                else if (pXv <= 50) { category = 'Categoría I'; modulesKey = 'I'; }
                                else if (pXv <= 200) { category = 'Categoría II'; modulesKey = 'II'; }
                                else if (pXv <= 1000) { category = 'Categoría III'; modulesKey = 'III'; }
                                else { category = 'Categoría IV'; modulesKey = 'IV'; }
                            }
                            fundamento = `Recipiente para gas peligroso (Grupo 1) con PS·V = ${pXv.toFixed(1)} bar·L.`;
                        } else {
                            table = 'Cuadro 2 (Recipientes, Gas, Grupo 2)';
                            if (sz <= 1) {
                                category = ps <= 1000 ? 'Artículo 4.3 (SEP)' : 'Categoría III';
                                modulesKey = ps <= 1000 ? 'SEP' : 'III';
                            } else {
                                if (pXv <= 50) { category = 'Artículo 4.3 (SEP)'; modulesKey = 'SEP'; }
                                else if (pXv <= 200) { category = 'Categoría I'; modulesKey = 'I'; }
                                else if (pXv <= 1000) { category = 'Categoría II'; modulesKey = 'II'; }
                                else if (pXv <= 3000) { category = 'Categoría III'; modulesKey = 'III'; }
                                else { category = 'Categoría IV'; modulesKey = 'IV'; }
                            }
                            fundamento = `Recipiente para gas no peligroso (Grupo 2) con PS·V = ${pXv.toFixed(1)} bar·L. Clasificado en ${category}.`;
                        }
                    } else { 
                        if (fluidGroup === '1') {
                            table = 'Cuadro 3 (Recipientes, Líquido, Grupo 1)';
                            if (pXv <= 200) { category = 'Artículo 4.3 (SEP)'; modulesKey = 'SEP'; }
                            else if (pXv <= 500) { category = 'Categoría I'; modulesKey = 'I'; }
                            else { category = 'Categoría II'; modulesKey = 'II'; }
                            fundamento = `Recipiente para líquido peligroso (Grupo 1). PS·V = ${pXv.toFixed(1)} bar·L.`;
                        } else {
                            table = 'Cuadro 4 (Recipientes, Líquido, Grupo 2)';
                            if (ps <= 10 || pXv <= 10000) { category = 'Artículo 4.3 (SEP)'; modulesKey = 'SEP'; }
                            else { category = 'Categoría I'; modulesKey = 'I'; }
                            fundamento = `Recipiente para líquido no peligroso (Grupo 2). PS·V = ${pXv.toFixed(1)} bar·L.`;
                        }
                    }
                } else if (equipmentType === 'piping') {
                    if (fluidState === 'gas') {
                        if (fluidGroup === '1') {
                            table = 'Cuadro 6 (Tuberías, Gas, Grupo 1)';
                            if (sz <= 25) { category = 'Artículo 4.3 (SEP)'; modulesKey = 'SEP'; }
                            else if (sz <= 100) { category = pXv <= 2000 ? 'Categoría I' : 'Categoría II'; modulesKey = pXv <= 2000 ? 'I' : 'II'; }
                            else { category = 'Categoría III'; modulesKey = 'III'; }
                        } else {
                            table = 'Cuadro 7 (Tuberías, Gas, Grupo 2)';
                            if (sz <= 32) { category = 'Artículo 4.3 (SEP)'; modulesKey = 'SEP'; }
                            else if (sz <= 100) { category = pXv <= 3500 ? 'Categoría I' : 'Categoría II'; modulesKey = pXv <= 3500 ? 'I' : 'II'; }
                            else { category = pXv <= 5000 ? 'Categoría II' : 'Categoría III'; modulesKey = pXv <= 5000 ? 'II' : 'III'; }
                        }
                    } else {
                        if (fluidGroup === '1') {
                            table = 'Cuadro 8 (Tuberías, Líquido, Grupo 1)';
                            if (sz <= 25 || pXv <= 2000) { category = 'Artículo 4.3 (SEP)'; modulesKey = 'SEP'; }
                            else { category = 'Categoría I'; modulesKey = 'I'; }
                        } else {
                            table = 'Cuadro 9 (Tuberías, Líquido, Grupo 2)';
                            if (sz <= 200 || pXv <= 5000) { category = 'Artículo 4.3 (SEP)'; modulesKey = 'SEP'; }
                            else { category = 'Categoría I'; modulesKey = 'I'; }
                        }
                    }
                    fundamento = `Tubería (DN ${sz}). PS·DN = ${pXv.toFixed(1)} bar·mm. Evaluado según ${table}.`;
                } else if (equipmentType === 'steam') {
                    table = 'Cuadro 5 (Equipos sometidos a llama o calor)';
                    if (sz <= 2) {
                        category = 'Artículo 4.3 (SEP)'; modulesKey = 'SEP';
                    } else {
                        if (pXv <= 50) { category = 'Artículo 4.3 (SEP)'; modulesKey = 'SEP'; }
                        else if (pXv <= 200) { category = 'Categoría I'; modulesKey = 'I'; }
                        else if (pXv <= 1000) { category = 'Categoría II'; modulesKey = 'II'; }
                        else if (pXv <= 3000) { category = 'Categoría III'; modulesKey = 'III'; }
                        else { category = 'Categoría IV'; modulesKey = 'IV'; }
                    }
                    fundamento = `Equipo sometido a llama o calor con volumen ${sz}L. PS·V = ${pXv.toFixed(1)} bar·L. Evaluado según ${table}.`;
                }

                let ceON = 'No Aplica';
                let onReq = 'NO Requerido';
                let art = 'Art. 4 Párr. 3';

                if (modulesKey !== 'SEP') {
                    art = 'Art. 4 Párr. 1';
                    if (modulesKey === 'I') {
                        ceON = 'Marcado CE (Autoevaluación)';
                        onReq = 'NO Requerido';
                    } else {
                        ceON = 'Marcado CE + ON Obligatorio';
                        onReq = 'SÍ Requerido';
                    }
                } else {
                    ceON = 'Sin Marcado CE (SEP)';
                }

                const inspections = getPeriodicInspections(equipmentType, modulesKey, fluidGroup);
                setResult({ cat: category, table: 'Anexo II - ' + table, ceON, onReq, art, modules: modulesKey, fundamento, pXv, inspections });
            };

            const [showPreview, setShowPreview] = useState(false);

            useEffect(() => {
                calculatePEDCategory();
            }, [pressure, size, equipmentType, fluidState, fluidGroup]);

            const handlePrint = () => {
                if (window.Android && typeof window.Android.print === 'function') {
                    // Android: llamar al puente nativo directamente
                    window.Android.print();
                } else {
                    // Desktop/Web: mostrar la plantilla y luego imprimir
                    setShowPreview(true);
                    setTimeout(() => { window.print(); }, 300);
                }
            };
            const currentDate = new Date().toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });

            return (
                <div className="w-full">
                    {/* --- VISTA WEB --- */}
                    <div className="max-w-6xl mx-auto p-4 md:p-8 no-print">
                        <div className="flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-6">
                            
                            {/* IMAGEN WEB BASE64 AQUÍ */}

                                </div>

                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                        <div className={`${showPreview ? 'block max-w-4xl mx-auto my-8 p-6 md:p-10 bg-white shadow-2xl rounded-2xl border border-gray-300' : 'hidden'} print:block text-gray-900 bg-white font-sans text-sm w-full`}>

                                            <td className="border border-gray-300 px-4 py-2 font-semibold">{pressure} bar</td>
                                            <td className="border border-gray-300 px-4 py-2 font-bold bg-gray-100 text-oca-blue">Estado del Fluido</td>
                                            <td className="border border-gray-300 px-4 py-2 uppercase font-semibold">{equipmentType === 'steam' ? 'Gas/Vapor' : fluidState === 'gas' ? 'Gas/Vapor' : 'Líquido'}</td>
                                        </tr>
                                        <tr>
                                            <td className="border border-gray-300 px-4 py-2 font-bold bg-gray-100 text-oca-blue">{equipmentType === 'piping' ? 'Diámetro Nom. (DN)' : 'Volumen (V)'}</td>
                                            <td className="border border-gray-300 px-4 py-2 font-semibold">{size} {equipmentType === 'piping' ? 'mm' : 'L'}</td>
                                            <td className="border border-gray-300 px-4 py-2 font-bold bg-gray-100 text-oca-blue">Grupo de Fluido</td>
                                            <td className="border border-gray-300 px-4 py-2 font-semibold">Grupo {fluidGroup} ({fluidGroup === '1' ? 'Peligroso' : 'No Peligroso'})</td>
                                        </tr>
                                        <tr>
                                            <td className="border border-gray-300 px-4 py-2 font-bold bg-gray-100 text-oca-blue">Límites Temp. (TS)</td>
                                            <td className="border border-gray-300 px-4 py-2 font-semibold" colSpan="3">{temp || 'No especificado'}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </section>

                            <section className="mb-8 print-break-inside-avoid">
                                <h3 className="bg-oca-blue text-white font-bold uppercase tracking-wider text-xs px-3 py-2 mb-0 border border-oca-blue">2. Resultados de la Clasificación (PED 2014/68/UE)</h3>
                                <div className="border border-t-0 border-gray-300 p-6 bg-gray-50">
                                    <div className="flex justify-between items-center mb-6">
                                        <div>
                                            <p className="text-xs text-gray-500 font-bold uppercase mb-1">Categoría Obtenida</p>
                                            <h4 className="text-4xl font-black text-oca-blue">{result.cat}</h4>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-xs text-gray-500 font-bold uppercase mb-1">Tabla de Aplicación</p>
                                            <h4 className="text-lg font-bold text-gray-800">{result.table}</h4>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-3 gap-4 border-t border-gray-300 pt-6">
                                        <div>
                                            <span className="block text-xs uppercase font-bold text-gray-500 mb-1">Producto Característico</span>
                                            <span className="font-bold text-oca-blue text-lg">PS·{equipmentType === 'piping' ? 'DN' : 'V'} = {result.pXv ? result.pXv.toFixed(1) : '0'}</span>
                                        </div>
                                        <div>
                                            <span className="block text-xs uppercase font-bold text-gray-500 mb-1">Artículo Referencia</span>
                                            <span className="font-bold text-gray-800 text-lg">{result.art}</span>
                                        </div>
                                        <div>
                                            <span className="block text-xs uppercase font-bold text-gray-500 mb-1">Organismo Notificado (ON)</span>
                                            <span className={`font-bold text-lg ${result.onReq === 'SÍ Requerido' ? 'text-oca-red' : 'text-gray-800'}`}>{result.onReq}</span>
                                        </div>
                                    </div>
                                </div>
                            </section>

                            <section className="mb-8 print-break-inside-avoid">
                                <h3 className="bg-oca-blue text-white font-bold uppercase tracking-wider text-xs px-3 py-2 mb-0 border border-oca-blue">3. Justificación Técnica</h3>
                                <div className="border border-t-0 border-gray-300 p-4">
                                    <p className="text-gray-800 leading-relaxed text-justify font-medium">{result.fundamento} El equipo debe cumplir con los requisitos esenciales de seguridad establecidos en el Anexo I de la Directiva.</p>
                                </div>
                            </section>

                            <section className="mb-8 print-break-inside-avoid">
                                <h3 className="bg-oca-blue text-white font-bold uppercase tracking-wider text-xs px-3 py-2 mb-0 border border-oca-blue">4. Procedimientos de Evaluación (Módulos)</h3>
                                <div className="border border-t-0 border-gray-300 p-4">
                                    {modulesData[result.modules].length > 0 ? (
                                        <ul className="space-y-3">
                                            {modulesData[result.modules].map((mod, idx) => (
                                                <li key={idx} className="flex gap-2">
                                                    <span className="text-oca-red font-bold">•</span>
                                                    <span><strong className="text-oca-blue">{mod.title}:</strong> <span className="text-gray-700">{mod.desc}</span></span>
                                                </li>
                                            ))}
                                        </ul>
                                    ) : (
                                        <p className="text-gray-800 font-medium">De acuerdo al Artículo 4, Párrafo 3, este equipo debe ser diseñado y fabricado según las buenas prácticas de ingeniería de un Estado miembro. No se requiere la intervención de un ON y no debe llevar el marcado CE referenciado en la directiva.</p>
                                    )}
                                </div>
                            </section>

                            <section className="mb-8 print-break-inside-avoid">
                                <h3 className="bg-oca-blue text-white font-bold uppercase tracking-wider text-xs px-3 py-2 mb-0 border border-oca-blue">
                                    5. Inspecciones Periódicas Reglamentarias ({result.inspections ? result.inspections.reglamento : 'RD 809/2021'})
                                </h3>
                                <div className="border border-t-0 border-gray-300 p-4">
                                    {result.inspections && result.inspections.aplica ? (
                                        <div>
                                            <p className="text-xs text-gray-700 mb-3 leading-relaxed">
                                                Conforme al <strong>Real Decreto 809/2021 (Reglamento de Equipos a Presión)</strong>, este equipo ({result.inspections.tipoLabel}, Cat. {result.inspections.catCode}) está sujeto a las siguientes inspecciones periódicas obligatorias:
                                            </p>
                                            <table className="w-full border-collapse border border-gray-300 text-xs">
                                                <thead>
                                                    <tr className="bg-gray-100 text-oca-blue">
                                                        <th className="border border-gray-300 px-3 py-2 text-left font-bold w-1/5">Nivel de Inspección</th>
                                                        <th className="border border-gray-300 px-3 py-2 text-center font-bold w-1/5">Periodicidad</th>
                                                        <th className="border border-gray-300 px-3 py-2 text-left font-bold w-1/4">Agente Responsable</th>
                                                        <th className="border border-gray-300 px-3 py-2 text-left font-bold">Alcance de la Inspección</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr>
                                                        <td className="border border-gray-300 px-3 py-2 font-bold text-gray-800">
                                                            Nivel A <span className="font-normal text-gray-500 block text-[10px]">(En servicio)</span>
                                                        </td>
                                                        <td className="border border-gray-300 px-3 py-2 text-center font-bold text-oca-blue">
                                                            {result.inspections.nivelA ? `${result.inspections.nivelA.años} años` : 'No Aplica'}
                                                        </td>
                                                        <td className="border border-gray-300 px-3 py-2 font-semibold">
                                                            {result.inspections.nivelA ? result.inspections.nivelA.agente : '-'}
                                                        </td>
                                                        <td className="border border-gray-300 px-3 py-2 text-gray-600">
                                                            Comprobación de documentación, estado exterior, fugas y verificación funcional de dispositivos de seguridad.
                                                        </td>
                                                    </tr>
                                                    <tr className="bg-gray-50/50">
                                                        <td className="border border-gray-300 px-3 py-2 font-bold text-gray-800">
                                                            Nivel B <span className="font-normal text-gray-500 block text-[10px]">(Fuera de servicio)</span>
                                                        </td>
                                                        <td className="border border-gray-300 px-3 py-2 text-center font-bold text-oca-blue">
                                                            {result.inspections.nivelB ? `${result.inspections.nivelB.años} años` : 'No Aplica'}
                                                        </td>
                                                        <td className="border border-gray-300 px-3 py-2 font-semibold text-oca-red">
                                                            {result.inspections.nivelB ? result.inspections.nivelB.agente : '-'}
                                                        </td>
                                                        <td className="border border-gray-300 px-3 py-2 text-gray-600">
                                                            Inspección de Nivel A más examen visual interior y exterior completo, medición de espesores y revisión de órganos de cierre.
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td className="border border-gray-300 px-3 py-2 font-bold text-gray-800">
                                                            Nivel C <span className="font-normal text-gray-500 block text-[10px]">(Prueba de presión)</span>
                                                        </td>
                                                        <td className="border border-gray-300 px-3 py-2 text-center font-bold text-oca-blue">
                                                            {result.inspections.nivelC ? `${result.inspections.nivelC.años} años` : 'No Aplica'}
                                                        </td>
                                                        <td className="border border-gray-300 px-3 py-2 font-semibold text-oca-red">
                                                            {result.inspections.nivelC ? result.inspections.nivelC.agente : '-'}
                                                        </td>
                                                        <td className="border border-gray-300 px-3 py-2 text-gray-600">
                                                            Inspección completa de Nivel B más prueba de presión hidrostática periódica o ensayos no destructivos equivalentes autorizados.
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    ) : (
                                        <p className="text-gray-700 text-xs leading-relaxed">
                                            {result.inspections ? result.inspections.motivo : 'No aplica inspección periódica oficial según el RD 809/2021.'}
                                        </p>
                                    )}
                                </div>
                            </section>
                            
                            <div className="mt-12 pt-4 border-t-2 border-gray-300 text-center text-xs text-gray-500 print-break-inside-avoid">
                                <p className="font-bold text-oca-blue text-sm mb-1">OCA Global - Inspección Reglamentaria</p>
                                <p>Generado automáticamente para propósitos orientativos basados en la Directiva 2014/68/UE y RD 809/2021.</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PEDCalculator />);
    </script>
</body>
</html>
